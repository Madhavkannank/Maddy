[project]
name = "maddy"
version = "0.1.0"
description = "M.A.D.D.Y. — Modular Autonomous Digital Daemon for You"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "onnxruntime>=1.16.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "noisereduce>=3.0.0",
    "edge-tts>=7.2.8",
    "faster-whisper>=1.0.0",
    "pydub>=0.25.1",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "sympy>=1.12.0",
    "psutil>=5.9.0",
    "pytesseract>=0.3.10; sys_platform == 'linux'",
    "pywin32>=306; sys_platform == 'win32'",
    "pycaw>=20240206; sys_platform == 'win32'",
    "winocr>=0.0.15; sys_platform == 'win32'",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
voice = [
    "openwakeword>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "app", "browser", "computer", "config", "core", "hardware", "integrations", "memory", "models", "personality", "platform_layer", "recovery", "security", "session_capture", "tasks", "tools", "verification", "voice", "vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "--ignore=tests/test_telegram_bot.py"
