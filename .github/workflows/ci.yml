name: CI - Clean Checkout & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libportaudio2 libasound2-dev wamerican

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify clean clone entrypoints with 0 errors
        run: |
          python -m app.cli --help
          python -c "import app.runtime; print('app.runtime imported successfully')"
          python -c "import session_capture.cli; print('session_capture.cli imported successfully')"
          python -c "import tools.messaging_tool; print('tools.messaging_tool imported successfully')"
          python -c "import core.tools; print('core.tools imported successfully')"

      - name: Run test suite
        run: |
          pytest -v tests/
